<html lang="en">
<head>
    <meta charset="UTF-8" />

    <title>HR Integrity Audit Survey – Beta ORI Inc.</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;

            color: #1e2a3a;
        }

        /* ---------- Header ---------- */
        .header {
            background: #ffffff;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;

        .header .tagline {
            font-size: 0.9rem; color: #4a5c72; font-weight: 300;
            border-left: 2px solid #d32f2f; padding-left: 1rem;
        }

        /* ---------- Main Container ---------- */
        .container { flex: 1; max-width: 980px; margin: 2rem auto; padding: 0 1.5rem; width: 100%; }
        .card {
            background: #ffffff; border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 2rem 2rem 1.8rem; transition: opacity 0.2s;
        }

        /* Progress bar */
        .progress-container { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
        .progress-bar { flex: 1; height: 6px; background: #e6eaef; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: #1a4b8c; width: 0%; transition: width 0.3s ease; }
        .progress-text { font-size: 0.85rem; font-weight: 600; color: #1a4b8c; min-width: 4rem; text-align: right; }

        /* Section header */
        .section-title { font-size: 1.6rem; font-weight: 600; color: #0b2a4a; margin-bottom: 0.25rem; }
        .section-subtitle { font-size: 0.95rem; color: #4a5c72; margin-bottom: 1.5rem; border-bottom: 1px solid #eef2f7; padding-bottom: 0.75rem; }

        /* Question group */
        .question-group { display: flex; flex-direction: column; gap: 1.4rem; margin-bottom: 2rem; }
        .question-item {
            background: #f9fafc; border-radius: 10px; padding: 1rem 1.2rem;
            border-left: 4px solid #1a4b8c; transition: all 0.2s;
        }
        .question-item .q-text { font-weight: 500; font-size: 1rem; color: #1e2a3a; margin-bottom: 0.6rem; }
        .question-item .q-text .q-num { color: #1a4b8c; font-weight: 600; margin-right: 0.4rem; }

        /* Likert radio group */
        .likert-group { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.3rem; padding-top: 0.2rem; }
        .likert-option { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 50px; }
        .likert-option input[type="radio"] { margin: 0 0 4px 0; width: 18px; height: 18px; cursor: pointer; accent-color: #1a4b8c; }
        .likert-option label { font-size: 0.7rem; font-weight: 500; color: #2c3e50; text-align: center; line-height: 1.2; cursor: pointer; }
        .likert-option input:checked + label { color: #1a4b8c; font-weight: 700; }

        /* Navigation buttons */
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.8rem; gap: 1rem; flex-wrap: wrap; }
        .btn {
            padding: 0.7rem 2rem; font-size: 1rem; font-weight: 600; border: none; border-radius: 50px;
            cursor: pointer; transition: background 0.2s, transform 0.1s; background: #eef2f7; color: #1e2a3a;
        }
        .btn-primary { background: #1a4b8c; color: #fff; }
        .btn-primary:hover { background: #0f3a6b; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #eef2f7; color: #1e2a3a; }
        .btn-secondary:hover { background: #dce3ec; }
        .btn-success { background: #2e7d32; color: #fff; }
        .btn-success:hover { background: #1b5e20; }
        .btn:active { transform: scale(0.96); }

        /* ---------- Footer ---------- */
        .footer {
            background: #ffffff; border-top: 1px solid #e6eaef; padding: 1.2rem 2rem;
            text-align: center; font-size: 0.85rem; color: #5a6c7e; margin-top: auto;
        }
        .footer strong { color: #1a4b8c; }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 0.4rem; padding: 0.8rem 1.2rem; }
            .header .tagline { border-left: none; padding-left: 0; }
            .container { padding: 0 0.8rem; margin: 1rem auto; }
            .card { padding: 1.2rem 1rem; }
            .section-title { font-size: 1.3rem; }
            .likert-group { flex-wrap: wrap; justify-content: flex-start; gap: 0.2rem; }
            .likert-option { flex: 0 0 auto; min-width: 44px; }
            .likert-option label { font-size: 0.6rem; }
            .btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
        }
        @media (max-width: 480px) {
            .question-item { padding: 0.8rem; }
            .likert-option { min-width: 36px; }
            .likert-option label { font-size: 0.55rem; }
            .nav-buttons { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; text-align: center; }
        }

        .section-wrapper { display: none; }
        .section-wrapper.active { display: block; }
        .question-item.required-missing { border-left-color: #d32f2f; background: #fff5f5; }
        .error-message { color: #d32f2f; font-size: 0.85rem; margin-top: 0.5rem; font-weight: 600; }

        /* Ranking alert badge */
        .rank-badge { display: inline-block; padding: 0.5rem 2rem; border-radius: 50px; font-weight: 700; font-size: 1.4rem; margin-top: 0.5rem; }
        .rank-green { background: #e8f5e9; color: #1b5e20; border: 2px solid #4caf50; }
        .rank-yellow { background: #fff8e1; color: #b7650e; border: 2px solid #ff9800; }
        .rank-red { background: #ffebee; color: #b71c1c; border: 2px solid #f44336; }
        .rank-score-grid { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; margin: 1.5rem 0; }
        .rank-score-item { background: #f9fafc; padding: 1rem 1.5rem; border-radius: 12px; min-width: 140px; text-align: center; }
        .rank-score-item .label { font-size: 0.8rem; color: #4a5c72; }
        .rank-score-item .value { font-size: 2rem; font-weight: 700; color: #1a4b8c; }
    </style>
</head>

                        { id: 'L8', text: 'Is there a clear, legally compliant policy for handling reference and employment verification requests?', type: 'likert' },
                        { id: 'L9', text: 'Are voluntary resignations investigated for underlying issues like managerial misconduct or burnout?', type: 'likert' },
                        { id: 'L10', text: 'Is the offboarding process reviewed periodically by legal and HR to minimize legal and security risks?', type: 'likert' }
                    ]
                },
                {
                    id: 'M', title: '13. Labor Law & Regulatory Compliance',
                    subtitle: 'Verifying adherence to local, state, and federal employment laws.',
                    questions: [
                        { id: 'M1', text: 'Are all required labor law posters displayed prominently in the workplace or digitally accessible?', type: 'likert' },
                        { id: 'M2', text: 'Is employee classification regularly audited for legal compliance?', type: 'likert' },
                        { id: 'M3', text: 'Are workplace policies updated promptly when local, state, or federal labor laws change?', type: 'likert' },
                        { id: 'M4', text: 'Is the organization fully compliant with minimum wage, prevailing wage, and equal pay legislation?', type: 'likert' },
                        { id: 'M5', text: 'Are family and medical leave requests processed in strict adherence to legal requirements?', type: 'likert' },
                        { id: 'M6', text: 'Is there a documented, lawful process for handling union relations or collective bargaining agreements?', type: 'likert' },
                        { id: 'M7', text: 'Are work eligibility verification forms completed, audited, and stored correctly within legal timeframes?', type: 'likert' },
                        { id: 'M8', text: 'Is the organization strictly compliant with child labor laws and restrictions on minor employees?', type: 'likert' },
                        { id: 'M9', text: 'Are mandatory regulatory reporting requirements filed accurately and on time?', type: 'likert' },
                        { id: 'M10', text: 'Does the organization maintain a centralized register of all HR-related audits, inspections, or regulatory inquiries?', type: 'likert' }
                    ]
                },
                {
                    id: 'N', title: '14. Remote Work & Flexible Arrangements',
                    subtitle: 'Assessing equity, security, and compliance in distributed work environments.',
                    questions: [
                        { id: 'N1', text: 'Is there a formal, written remote work policy outlining expectations, eligibility, and security requirements?', type: 'likert' },
                        { id: 'N2', text: 'Are remote employees evaluated on output and results rather than hours logged?', type: 'likert' },
                        { id: 'N3', text: 'Is there a clear, fair policy on reimbursing remote work expenses?', type: 'likert' },
                        { id: 'N4', text: 'Are data security protocols strictly enforced for remote workers?', type: 'likert' },
                        { id: 'N5', text: 'Is there a proactive mechanism to ensure remote workers have equal access to career development and promotion opportunities?', type: 'likert' },
                        { id: 'N6', text: 'Are working hours and "right-to-disconnect" policies respected to prevent remote employee burnout?', type: 'likert' },
                        { id: 'N7', text: 'Is there a process for addressing health, safety, and ergonomic concerns in a remote worker’s home office?', type: 'likert' },
                        { id: 'N8', text: 'Are flexible work arrangements granted fairly, without bias toward specific demographics?', type: 'likert' },
                        { id: 'N9', text: 'Is cross-border remote work governed by clear tax, legal, and permanent establishment compliance checks?', type: 'likert' },
                        { id: 'N10', text: 'Are remote team-building and inclusion initiatives actively funded to prevent isolation?', type: 'likert' }
                    ]
                },
                {
                    id: 'O', title: '15. HR Governance, Policy, & Audit Readiness',
                    subtitle: 'Evaluating the structural integrity, documentation, and continuous improvement of HR operations.',
                    questions: [
                        { id: 'O1', text: 'Is there a centralized, easily accessible, and version-controlled repository for all current HR policies?', type: 'likert' },
                        { id: 'O2', text: 'Are HR policies reviewed and updated at least annually by HR, legal, and compliance teams?', type: 'likert' },
                        { id: 'O3', text: 'Is there a clear organizational chart showing reporting lines and segregation of duties within the HR department?', type: 'likert' },
                        { id: 'O4', text: 'Are HR staff provided with ongoing professional development, certification support, and ethics training?', type: 'likert' },
                        { id: 'O5', text: 'Is there a documented business continuity and disaster recovery plan specifically for HR operations?', type: 'likert' },
                        { id: 'O6', text: 'Are internal HR audits conducted periodically, with findings reported to senior management?', type: 'likert' },
                        { id: 'O7', text: 'Is there a formal process for tracking, remediating, and closing findings from previous compliance audits?', type: 'likert' },
                        { id: 'O8', text: 'Are key HR metrics regularly reported to leadership for strategic decision-making?', type: 'likert' },
                        { id: 'O9', text: 'Is there a clear policy governing the use of AI or automated tools in HR decision-making to prevent algorithmic bias?', type: 'likert' },
                        { id: 'O10', text: 'Does the HR department have a designated compliance officer or point of contact for integrity-related matters?', type: 'likert' }
                    ]
                }
            ]
        };

        // ============================================================
        //  STATE & SAFE STORAGE
        // ============================================================
        let currentSection = 0;
        const totalSections = surveyData.sections.length;
        let answers = {};

        try {
            const stored = localStorage.getItem('hr_integrity_audit_answers');
            if (stored) {
                answers = JSON.parse(stored);
            }
        } catch (e) {
            console.warn("LocalStorage access denied or unavailable. Survey will function in-memory only.", e);
        }

        // ============================================================
        //  RENDER & VALIDATION
        // ============================================================
        function renderSection(index) {
            const section = surveyData.sections[index];
            const container = document.getElementById('sectionsContainer');
            if (!container) return;

            let html = `<div class="section-wrapper active" data-section="${section.id}">`;
            html += `<h2 class="section-title">${section.title}</h2>`;
            html += `<p class="section-subtitle">${section.subtitle}</p>`;
            html += `<div class="question-group">`;

            section.questions.forEach((q, idx) => {
                const qid = q.id;
                const saved = (answers[section.id] && answers[section.id][qid]) || '';
                html += `<div class="question-item" data-qid="${qid}">`;
                html += `<div class="q-text"><span class="q-num">${idx+1}.</span> ${q.text}</div>`;
                html += `<div class="likert-group">`;
                
                const options = [
                    { value: '1', label: 'Strongly Disagree' },
                    { value: '2', label: 'Disagree' },
                    { value: '3', label: 'Neutral' },
                    { value: '4', label: 'Agree' },
                    { value: '5', label: 'Strongly Agree' }
                ];

                options.forEach(opt => {
                    const checked = (saved === opt.value) ? 'checked' : '';
                    html += `<div class="likert-option">`;
                    html += `<input type="radio" name="${qid}" value="${opt.value}" id="${qid}_${opt.value}" ${checked} />`;
                    html += `<label for="${qid}_${opt.value}">${opt.label}</label>`;
                    html += `</div>`;
                });
                html += `</div></div>`;
            });

            html += `</div></div>`;
            container.innerHTML = html;

            // Attach listeners
            const sectionId = section.id;
            document.querySelectorAll(`.section-wrapper[data-section="${sectionId}"] input[type="radio"]`).forEach(el => {
                el.addEventListener('change', function() {
                    if (!answers[sectionId]) answers[sectionId] = {};
                    answers[sectionId][this.name] = this.value;
                    saveToStorage();
                    updateProgress();
                });
            });

            updateProgress();
            updateNavButtons();
        }

        function validateCurrentSection() {
            const section = surveyData.sections[currentSection];
            const sectionId = section.id;
            const sectionAnswers = answers[sectionId] || {};
            
            let allAnswered = true;
            let firstUnansweredQid = null;

            section.questions.forEach(q => {
                if (!sectionAnswers[q.id] || sectionAnswers[q.id].trim() === '') {
                    allAnswered = false;
                    if (!firstUnansweredQid) firstUnansweredQid = q.id;
                }
            });

            document.querySelectorAll('.required-missing').forEach(el => {
                el.classList.remove('required-missing');
                const errorMsg = el.querySelector('.error-message');
                if (errorMsg) errorMsg.remove();
            });

            if (!allAnswered) {
                const qElement = document.querySelector(`.question-item[data-qid="${firstUnansweredQid}"]`);
                if (qElement) {
                    qElement.classList.add('required-missing');
                    qElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'error-message';
                    errorMsg.textContent = '⚠️ Please answer this question before proceeding.';
                    qElement.appendChild(errorMsg);
                }
                return false;
            }
            return true;
        }

        function updateProgress() {
            const pct = Math.round(((currentSection + 1) / totalSections) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = pct + '%';
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');

            prevBtn.disabled = (currentSection === 0);
            if (currentSection === totalSections - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
                submitBtn.style.display = 'none';
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem('hr_integrity_audit_answers', JSON.stringify(answers));
            } catch (e) {
                console.warn("LocalStorage save failed.", e);
            }
        }

        function goToSection(index) {
            if (index < 0 || index >= totalSections) return;
            currentSection = index;
            renderSection(currentSection);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        //  SUBMIT & SCORING LOGIC
        // ============================================================
        function submitSurvey() {
            let finalAnswers = {};
            try {
                finalAnswers = JSON.parse(localStorage.getItem('hr_integrity_audit_answers') || '{}');
            } catch (e) {
                finalAnswers = answers;
            }
            
            let totalScore = 0;
            let totalAnswered = 0;
            let highRiskCount = 0; // Scores of 4 or 5 indicate agreement with risk factors

            surveyData.sections.forEach(section => {
                section.questions.forEach(q => {
                    const val = parseInt(finalAnswers[section.id]?.[q.id]);
                    if (!isNaN(val)) {
                        totalScore += val;
                        totalAnswered++;
                        if (val >= 4) {
                            highRiskCount++;
                        }
                    }
                });
            });

            const riskExposurePercentage = totalAnswered > 0 ? Math.round((highRiskCount / totalAnswered) * 100) : 0;
            const averageScore = totalAnswered > 0 ? (totalScore / totalAnswered).toFixed(2) : 0;

            let alertLevel, badgeClass, alertEmoji, recommendation;
            
            if (riskExposurePercentage >= 30) {
                alertLevel = 'HIGH RISK – Critical Integrity Gaps Detected';
                badgeClass = 'rank-red';
                alertEmoji = '🔴';
                recommendation = 'Immediate remediation required. Multiple high-risk indicators suggest systemic vulnerabilities in HR compliance and ethical controls. Initiate a formal internal investigation and prioritize policy enforcement.';
            } else if (riskExposurePercentage >= 15) {
                alertLevel = 'MODERATE RISK – Actionable Compliance Gaps';
                badgeClass = 'rank-yellow';
                alertEmoji = '🟡';
                recommendation = 'Targeted intervention needed. While foundational controls exist, specific domains show elevated risk factors. Develop a 90-day remediation plan for flagged areas.';
            } else {
                alertLevel = 'LOW RISK – Strong Integrity & Compliance Controls';
                badgeClass = 'rank-green';
                alertEmoji = '🟢';
                recommendation = 'The organization demonstrates robust HR integrity controls. Continue routine monitoring, annual policy reviews, and proactive compliance training to maintain this standard.';
            }

            const submission = {
                timestamp: new Date().toISOString(),
                survey_version: '1.0 (HR Integrity Audit - 150 Points)',
                scoring_summary: {
                    total_questions_answered: totalAnswered,
                    average_response_index: averageScore,
                    high_risk_indicators_count: highRiskCount,
                    risk_exposure_percentage: riskExposurePercentage + '%',
                    alert_level: alertLevel
                },
                sections: surveyData.sections.map(s => ({
                    id: s.id,
                    title: s.title,
                    answers: finalAnswers[s.id] || {}
                })),
                raw: finalAnswers
            };

            // Generate and download JSON file
            const blob = new Blob([JSON.stringify(submission, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hr_integrity_audit_report_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Show Ranking Report Card
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = `
                <div style="text-align:center; padding:1rem 0;">
                    <h2 style="color:#1a4b8c;">🏆 HR Integrity Audit Ranking Report</h2>
                    <p style="font-size:1rem; color:#4a5c72; max-width: 700px; margin: 0.5rem auto;">Based on your responses across all 150 assessment points, here is the organizational integrity risk exposure:</p>
                    <div style="margin: 1.5rem 0;">
                        <span class="rank-badge ${badgeClass}">${alertEmoji} ${alertLevel}</span>
                    </div>
                    <div class="rank-score-grid">
                        <div class="rank-score-item"><div class="label">Questions Answered</div><div class="value">${totalAnswered} / 150</div></div>
                        <div class="rank-score-item"><div class="label">Avg. Response Index</div><div class="value">${averageScore} / 5.0</div></div>
                        <div class="rank-score-item"><div class="label">High-Risk Indicators</div><div class="value">${highRiskCount}</div></div>
                        <div class="rank-score-item"><div class="label">Risk Exposure</div><div class="value">${riskExposurePercentage}%</div></8></div>
                    </div>
                    <div style="background:#f9fafc; padding:1.5rem; border-radius:12px; max-width:700px; margin:1.5rem auto; text-align:left; border-left: 4px solid #1a4b8c;">
                        <strong style="color:#1a4b8c; font-size:1.1rem;">🔍 Auditor Recommendation:</strong>
                        <p style="margin-top:0.5rem; color:#2c3e50; line-height: 1.6;">${recommendation}</p>
                    </div>
                    <p style="color:#4a5c72; font-size:0.9rem; margin-top:1.5rem;">
                        Your full detailed responses and scoring matrix have been downloaded as a JSON file for your records.
                    </p>
                    <button class="btn btn-primary" style="margin-top:1.5rem;" onclick="location.reload()">Start New Audit</button>
                </div>
            `;
            document.getElementById('navButtons').style.display = 'none';
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressText').textContent = '100%';
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderSection(0);

            document.getElementById('prevBtn').addEventListener('click', function() {
                goToSection(currentSection - 1);
            });
            
            document.getElementById('nextBtn').addEventListener('click', function() {
                if (validateCurrentSection()) {
                    goToSection(currentSection + 1);
                }
            });
            
            document.getElementById('submitBtn').addEventListener('click', function() {
                if (validateCurrentSection()) {
                    if (confirm('Submit your audit and view the HR Integrity Risk Ranking Report?')) {
                        submitSurvey();
                    }
                }
            });
        });
    </script>
</body>
</html>
