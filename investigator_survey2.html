<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerShield – Integrity Ranking & Investigation Survey</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #1e2a3a;
        }

        /* ---------- Header ---------- */
        .header {
            background: #ffffff;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 3px solid #1a4b8c;
        }

        .header .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a4b8c;
            letter-spacing: -0.5px;
        }
        .header .logo span {
            color: #d32f2f;
            font-weight: 300;
        }
        .header .tagline {
            font-size: 0.9rem;
            color: #4a5c72;
            font-weight: 300;
            border-left: 2px solid #d32f2f;
            padding-left: 1rem;
        }

        /* ---------- Main Container ---------- */
        .container {
            flex: 1;
            max-width: 980px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        /* ---------- Card / Wizard ---------- */
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 2rem 2rem 1.8rem;
            transition: opacity 0.2s;
        }

        /* Progress bar */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: #e6eaef;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #1a4b8c;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a4b8c;
            min-width: 4rem;
            text-align: right;
        }

        /* Section header */
        .section-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0b2a4a;
            margin-bottom: 0.25rem;
        }
        .section-subtitle {
            font-size: 0.95rem;
            color: #4a5c72;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eef2f7;
            padding-bottom: 0.75rem;
        }

        /* Question group */
        .question-group {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            margin-bottom: 2rem;
        }

        .question-item {
            background: #f9fafc;
            border-radius: 10px;
            padding: 1rem 1.2rem;
            border-left: 4px solid #1a4b8c;
        }
        .question-item .q-text {
            font-weight: 500;
            font-size: 1rem;
            color: #1e2a3a;
            margin-bottom: 0.6rem;
        }
        .question-item .q-text .q-num {
            color: #1a4b8c;
            font-weight: 600;
            margin-right: 0.4rem;
        }

        /* Likert radio group */
        .likert-group {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.3rem;
            padding-top: 0.2rem;
        }
        .likert-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 50px;
        }
        .likert-option input[type="radio"] {
            margin: 0 0 4px 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1a4b8c;
        }
        .likert-option label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #2c3e50;
            text-align: center;
            line-height: 1.2;
            cursor: pointer;
        }
        .likert-option input:checked+label {
            color: #1a4b8c;
            font-weight: 700;
        }

        /* Textarea for open-ended */
        .open-ended textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #d0d8e2;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border 0.2s;
            background: #ffffff;
        }
        .open-ended textarea:focus {
            outline: none;
            border-color: #1a4b8c;
            box-shadow: 0 0 0 3px rgba(26, 75, 140, 0.15);
        }

        /* Navigation buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.8rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.7rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            background: #eef2f7;
            color: #1e2a3a;
        }
        .btn-primary {
            background: #1a4b8c;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0f3a6b;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #eef2f7;
            color: #1e2a3a;
        }
        .btn-secondary:hover {
            background: #dce3ec;
        }
        .btn-success {
            background: #2e7d32;
            color: #fff;
        }
        .btn-success:hover {
            background: #1b5e20;
        }
        .btn:active {
            transform: scale(0.96);
        }

        /* ---------- Footer ---------- */
        .footer {
            background: #ffffff;
            border-top: 1px solid #e6eaef;
            padding: 1.2rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #5a6c7e;
            margin-top: auto;
        }
        .footer strong {
            color: #1a4b8c;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
                padding: 0.8rem 1.2rem;
            }
            .header .tagline {
                border-left: none;
                padding-left: 0;
            }
            .container {
                padding: 0 0.8rem;
                margin: 1rem auto;
            }
            .card {
                padding: 1.2rem 1rem;
            }
            .section-title {
                font-size: 1.3rem;
            }
            .likert-group {
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 0.2rem;
            }
            .likert-option {
                flex: 0 0 auto;
                min-width: 44px;
            }
            .likert-option label {
                font-size: 0.6rem;
            }
            .btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .question-item {
                padding: 0.8rem;
            }
            .likert-option {
                min-width: 36px;
            }
            .likert-option label {
                font-size: 0.55rem;
            }
            .nav-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }

        .section-wrapper {
            display: none;
        }
        .section-wrapper.active {
            display: block;
        }

        .question-item.required-missing {
            border-left-color: #d32f2f;
            background: #fff5f5;
        }
        .error-message {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            font-weight: 500;
        }

        /* Ranking alert badge */
        .rank-badge {
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.4rem;
            margin-top: 0.5rem;
        }
        .rank-green {
            background: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #4caf50;
        }
        .rank-yellow {
            background: #fff8e1;
            color: #b7650e;
            border: 2px solid #ff9800;
        }
        .rank-red {
            background: #ffebee;
            color: #b71c1c;
            border: 2px solid #f44336;
        }
        .rank-score-grid {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .rank-score-item {
            background: #f9fafc;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            min-width: 140px;
        }
        .rank-score-item .label {
            font-size: 0.8rem;
            color: #4a5c72;
        }
        .rank-score-item .value {
            font-size: 2rem;
            font-weight: 700;
            color: #1a4b8c;
        }
    </style>
</head>

                    { id: 'H10', text: 'I have suffered financial stress (missed bills, debt) due to reduced hours or loss of commission.', type: 'likert' },
                    { id: 'H11', text: 'I have felt hopeless or trapped in my current employment situation.', type: 'likert' },
                    { id: 'H12', text: 'The stress has caused me to disengage from hobbies or activities I used to enjoy.', type: 'likert' },
                    { id: 'H13', text: 'I have cried at work or on my way to work due to workplace interactions.', type: 'likert' },
                    { id: 'H14', text: 'I have considered resigning without another job lined up simply to protect my mental health.', type: 'likert' },
                    { id: 'H15', text: 'I have witnessed a colleague suffer a breakdown or serious health scare linked to workplace pressure.', type: 'likert' }
                ]
            }, {
                id: 'I',
                title: 'Witness & Bystander Corroboration',
                subtitle: 'Investigations require independent witnesses. Your observations can help corroborate toxic patterns.',
                questions: [
                    { id: 'I1', text: 'I have witnessed a colleague being publicly humiliated or yelled at by a supervisor.', type: 'likert' },
                    { id: 'I2', text: 'I have observed senior leaders ignoring or dismissing reports of misconduct.', type: 'likert' },
                    { id: 'I3', text: 'I have seen managers take credit for the work of their subordinates.', type: 'likert' },
                    { id: 'I4', text: 'I have observed employees being told to falsify data, timecards, or quality reports.', type: 'likert' },
                    { id: 'I5', text: 'I have witnessed toxic "mobbing" where a group of employees isolated a target.', type: 'likert' },
                    { id: 'I6', text: 'I have heard managers joke about or dismiss harassment complaints.', type: 'likert' },
                    { id: 'I7', text: 'I have seen the organization overlook misconduct because the employee brings in revenue.', type: 'likert' },
                    { id: 'I8', text: 'I have observed a pattern of favoritism toward certain demographic groups in promotions.', type: 'likert' },
                    { id: 'I9', text: 'I have witnessed employees being coerced into signing NDAs under duress.', type: 'likert' },
                    { id: 'I10', text: 'I have seen HR engage in "cover-up" behavior to protect senior management.', type: 'likert' },
                    { id: 'I11', text: 'I have observed an employee being placed on a PIP immediately after returning from medical leave.', type: 'likert' },
                    { id: 'I12', text: 'I have been asked by management to provide negative feedback about a colleague that I did not genuinely hold.', type: 'likert' },
                    { id: 'I13', text: 'I have witnessed a colleague being excluded from social events crucial to networking.', type: 'likert' },
                    { id: 'I14', text: 'I am aware of employees who quit because they could no longer tolerate the environment.', type: 'likert' },
                    { id: 'I15', text: 'I would be willing to speak confidentially with an external investigator to verify what I have seen.', type: 'likert' }
                ]
            }, {
                id: 'J',
                title: '⭐ Integrity Ranking & "Red Flag" Alert (Rank My Workplace)',
                subtitle: 'This is your final "Rank My Professor" style scorecard. Your answers here generate an alert level to warn other employees.',
                questions: [
                    { id: 'J1', text: 'Rate the ethical integrity and honesty of your DIRECT SUPERVISOR.', type: 'likert' },
                    { id: 'J2', text: 'Rate the ethical integrity and honesty of the HUMAN RESOURCES (HR) department.', type: 'likert' },
                    { id: 'J3', text: 'Rate the transparency, honesty, and integrity of SENIOR LEADERSHIP / EXECUTIVES.', type: 'likert' },
                    { id: 'J4', text: 'Based on your experience, would you WARN other job seekers to AVOID this organization? (1=Strongly Warn to Avoid, 5=Highly Recommend to Join)', type: 'likert' }
                ]
            }]
        };

        // ============================================================
        //  STATE
        // ============================================================
        let currentSection = 0;
        const totalSections = surveyData.sections.length;
        let answers = {};

        // Load from localStorage
        const stored = localStorage.getItem('careershield_survey_answers');
        if (stored) {
            try {
                answers = JSON.parse(stored);
            } catch (_) {}
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderSection(index) {
            const section = surveyData.sections[index];
            const container = document.getElementById('sectionsContainer');
            if (!container) return;

            let html = `<div class="section-wrapper active" data-section="${section.id}">`;
            html += `<h2 class="section-title">Section ${section.id}: ${section.title}</h2>`;
            html += `<p class="section-subtitle">${section.subtitle}</p>`;
            html += `<div class="question-group">`;

            section.questions.forEach((q, idx) => {
                const qid = q.id;
                const saved = (answers[section.id] && answers[section.id][qid]) || '';
                const isLikert = q.type === 'likert';
                html += `<div class="question-item" data-qid="${qid}">`;
                html += `<div class="q-text"><span class="q-num">${idx+1}.</span> ${q.text}</div>`;

                if (isLikert) {
                    html += `<div class="likert-group">`;
                    const options = [
                        { value: '1', label: 'Strongly Disagree' },
                        { value: '2', label: 'Disagree' },
                        { value: '3', label: 'Neutral' },
                        { value: '4', label: 'Agree' },
                        { value: '5', label: 'Strongly Agree' }
                    ];
                    // For Section J, relabel the scale to make it ranking-friendly
                    if (section.id === 'J') {
                        // Override labels for clarity
                        const rankLabels = [
                            { value: '1', label: 'Very Low / Warn' },
                            { value: '2', label: 'Low' },
                            { value: '3', label: 'Moderate' },
                            { value: '4', label: 'High' },
                            { value: '5', label: 'Very High / Recommend' }
                        ];
                        rankLabels.forEach(opt => {
                            const checked = (saved === opt.value) ? 'checked' : '';
                            html += `<div class="likert-option">`;
                            html +=
                                `<input type="radio" name="${qid}" value="${opt.value}" id="${qid}_${opt.value}" ${checked} />`;
                            html += `<label for="${qid}_${opt.value}">${opt.label}</label>`;
                            html += `</div>`;
                        });
                    } else {
                        options.forEach(opt => {
                            const checked = (saved === opt.value) ? 'checked' : '';
                            html += `<div class="likert-option">`;
                            html +=
                                `<input type="radio" name="${qid}" value="${opt.value}" id="${qid}_${opt.value}" ${checked} />`;
                            html += `<label for="${qid}_${opt.value}">${opt.label}</label>`;
                            html += `</div>`;
                        });
                    }
                    html += `</div>`;
                } else {
                    html += `<div class="open-ended">`;
                    html += `<textarea name="${qid}" rows="3" placeholder="Type your response here...">${saved}</textarea>`;
                    html += `</div>`;
                }

                html += `</div>`;
            });

            html += `</div></div>`;

            container.innerHTML = html;

            // Attach listeners
            const sectionId = section.id;
            document.querySelectorAll(`.section-wrapper[data-section="${sectionId}"] input[type="radio"]`).forEach(el => {
                el.addEventListener('change', function() {
                    const name = this.name;
                    const val = this.value;
                    if (!answers[sectionId]) answers[sectionId] = {};
                    answers[sectionId][name] = val;
                    saveToStorage();
                    updateProgress();
                });
            });
            document.querySelectorAll(`.section-wrapper[data-section="${sectionId}"] textarea`).forEach(el => {
                el.addEventListener('input', function() {
                    const name = this.name;
                    const val = this.value;
                    if (!answers[sectionId]) answers[sectionId] = {};
                    answers[sectionId][name] = val;
                    saveToStorage();
                });
            });

            updateProgress();
            updateNavButtons();
        }

        function updateProgress() {
            const total = totalSections;
            const current = currentSection + 1;
            const pct = Math.round((current / total) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = pct + '%';
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');

            prevBtn.disabled = (currentSection === 0);
            if (currentSection === totalSections - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'inline-block';
                submitBtn.textContent = '🏆 Submit & View Ranking';
            } else {
                nextBtn.style.display = 'inline-block';
                submitBtn.style.display = 'none';
            }
        }

        function saveToStorage() {
            localStorage.setItem('careershield_survey_answers', JSON.stringify(answers));
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function goToSection(index) {
            if (index < 0 || index >= totalSections) return;
            currentSection = index;
            renderSection(currentSection);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        //  SUBMIT & CALCULATE RANKING (Red Flag Alert)
        // ============================================================
        function submitSurvey() {
            const finalAnswers = JSON.parse(localStorage.getItem('careershield_survey_answers') || '{}');
            const jAnswers = finalAnswers['J'] || {};

            // Calculate Integrity Scores (1-5)
            const supervisorScore = parseFloat(jAnswers['J1']) || 0;
            const hrScore = parseFloat(jAnswers['J2']) || 0;
            const leadershipScore = parseFloat(jAnswers['J3']) || 0;
            const warnScore = parseFloat(jAnswers['J4']) || 0;

            // Overall Integrity Index (average of J1, J2, J3)
            const avgIntegrity = (supervisorScore + hrScore + leadershipScore) / 3;
            // Overall "Rank" is the average of all 4
            const overallRank = (supervisorScore + hrScore + leadershipScore + warnScore) / 4;

            let alertLevel, badgeClass, alertEmoji;
            if (overallRank >= 4.0) {
                alertLevel = '🟢 SAFE / HIGH INTEGRITY';
                badgeClass = 'rank-green';
                alertEmoji = '✅';
            } else if (overallRank >= 2.5) {
                alertLevel = '🟡 MODERATE RISK – Proceed with Caution';
                badgeClass = 'rank-yellow';
                alertEmoji = '⚠️';
            } else {
                alertLevel = '🔴 HIGH ALERT – Systemic Integrity Failure (Warn Others!)';
                badgeClass = 'rank-red';
                alertEmoji = '🚨';
            }

            // Build submission JSON
            const submission = {
                timestamp: new Date().toISOString(),
                survey_version: '1.0 (10 sections with Integrity Ranking)',
                integrity_ranking: {
                    supervisor_integrity: supervisorScore,
                    hr_integrity: hrScore,
                    leadership_integrity: leadershipScore,
                    warn_others_score: warnScore,
                    overall_integrity_score: Math.round(overallRank * 10) / 10,
                    alert_level: alertLevel,
                    alert_emoji: alertEmoji
                },
                sections: surveyData.sections.map(s => ({
                    id: s.id,
                    title: s.title,
                    answers: finalAnswers[s.id] || {}
                })),
                raw: finalAnswers
            };

            // Download JSON
            const blob = new Blob([JSON.stringify(submission, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `careershield_rank_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // --- Show Ranking Report Card ---
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = `
                <div style="text-align:center; padding:1rem 0;">
                    <h2 style="color:#1a4b8c;">🏆 Integrity Ranking Report Card</h2>
                    <p style="font-size:1rem; color:#4a5c72;">Based on your responses (Section J), here is the "Rank My Workplace" alert level:</p>

                    <div style="margin: 1.5rem 0;">
                        <span class="rank-badge ${badgeClass}">${alertEmoji} ${alertLevel}</span>
                    </div>

                    <div class="rank-score-grid">
                        <div class="rank-score-item">
                            <div class="label">👤 Supervisor Integrity</div>
                            <div class="value">${supervisorScore.toFixed(1)} / 5</div>
                        </div>
                        <div class="rank-score-item">
                            <div class="label">🏢 HR Integrity</div>
                            <div class="value">${hrScore.toFixed(1)} / 5</div>
                        </div>
                        <div class="rank-score-item">
                            <div class="label">👔 Leadership Integrity</div>
                            <div class="value">${leadershipScore.toFixed(1)} / 5</div>
                        </div>
                        <div class="rank-score-item">
                            <div class="label">🚩 Warn Others Score</div>
                            <div class="value">${warnScore.toFixed(1)} / 5</div>
                        </div>
                    </div>

                    <div style="background:#f9fafc; padding:1rem; border-radius:12px; max-width:600px; margin:1rem auto; text-align:left;">
                        <strong>🔍 What this means:</strong>
                        <ul style="margin-top:0.5rem; padding-left:1.2rem; color:#2c3e50;">
                            <li><strong>≥ 4.0</strong> – Green: Healthy environment. No immediate warning issued.</li>
                            <li><strong>2.5 – 3.9</strong> – Yellow: Proceed with caution. Moderate ethical risks detected.</li>
                            <li><strong>&lt; 2.5</strong> – Red: <strong>HIGH ALERT.</strong> Severe integrity failures. Strongly warn others to avoid.</li>
                        </ul>
                    </div>

                    <p style="color:#4a5c72; font-size:0.9rem; margin-top:1rem;">
                        Your full detailed responses (including all sections) have been downloaded as a JSON file.
                        This ranking will be used to alert potential employees.
                    </p>
                    <button class="btn btn-primary" style="margin-top:1.5rem;" onclick="location.reload()">Start New Survey</button>
                </div>
            `;
            document.getElementById('navButtons').style.display = 'none';
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressText').textContent = '100%';
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderSection(0);

            document.getElementById('prevBtn').addEventListener('click', function() {
                goToSection(currentSection - 1);
            });
            document.getElementById('nextBtn').addEventListener('click', function() {
                goToSection(currentSection + 1);
            });
            document.getElementById('submitBtn').addEventListener('click', function() {
                if (confirm('Submit your survey and view the Integrity Ranking Report Card?')) {
                    submitSurvey();
                }
            });
        });
    </script>

</body>
</html>
